name: Sync BAT wheels

on:
  workflow_dispatch:
  pull_request:
    paths:
      - requirements/bat-v1/requirements.txt
      - requirements/bat-v2/requirements.txt
  # Re-sync after Dependabot merges a pin-only bump (PR sync can miss the wheel).
  push:
    branches: [main]
    paths:
      - requirements/bat-v1/requirements.txt
      - requirements/bat-v2/requirements.txt

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # PR: head branch. Push/dispatch: the triggering ref.
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Read pinned BAT versions
        id: pins
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          def read_pin(req_path: Path) -> str:
              for line in req_path.read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if line and not line.startswith("#"):
                      return line.split("==", 1)[1].strip()
              raise SystemExit(f"No pin found in {req_path}")

          root = Path(".")
          v1 = read_pin(root / "requirements/bat-v1/requirements.txt")
          v2 = read_pin(root / "requirements/bat-v2/requirements.txt")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"v1={v1}\n")
              fh.write(f"v2={v2}\n")
          PY

      - name: Download BAT v1 and v2 wheels
        run: |
          # Drop stale BAT wheels so only the pinned versions remain.
          mkdir -p wheels
          rm -f wheels/blender_asset_tracer-*.whl
          pip download "blender-asset-tracer==${{ steps.pins.outputs.v1 }}" \
            -d wheels --no-deps --only-binary=:all:
          pip download "blender-asset-tracer==${{ steps.pins.outputs.v2 }}" \
            -d wheels --no-deps --only-binary=:all:
          # Fail if pip left us without exactly the two pinned wheels.
          python - <<'PY'
          from pathlib import Path
          v1 = "${{ steps.pins.outputs.v1 }}"
          v2 = "${{ steps.pins.outputs.v2 }}"
          expect = sorted([
              f"blender_asset_tracer-{v1}-py3-none-any.whl",
              f"blender_asset_tracer-{v2}-py3-none-any.whl",
          ])
          names = sorted(w.name for w in Path("wheels").glob("blender_asset_tracer-*.whl"))
          if names != expect:
              raise SystemExit(f"expected {expect!r}, found {names}")
          print(f"BAT wheels ready: {', '.join(names)}")
          PY

      - name: Commit sync changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first so new/deleted wheels count (git diff alone ignores untracked).
          git add -A wheels
          if git diff --cached --quiet; then
            echo "BAT wheels already up to date."
            exit 0
          fi
          git commit -m "Sync BAT v1/v2 wheels from requirements pins"
          git status --short

      - name: Push changes
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          git push
          git log -1 --oneline
